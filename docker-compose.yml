version: "3.9"

services:
  # -------------------------------------------------------------
  # Frontend Application (React 18 + Vite + Tailwind + Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        - VITE_API_BASE_URL=http://localhost:5000/api
    container_name: rentmaikar-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - rentmaikar-network

  # -------------------------------------------------------------
  # Backend API Gateway & Microservices (Node.js / Express / TypeScript)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentmaikar-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      # CPaaS Gateway Secrets
      - SENT_API_KEY=${SENT_API_KEY:-}
      - SENT_SENDER_ID=${SENT_SENDER_ID:-Rentmaikar}
      - SENT_WHATSAPP_NUMBER=${SENT_WHATSAPP_NUMBER:-}
      - SENT_WEBHOOK_SECRET=${SENT_WEBHOOK_SECRET:-}
      - SENT_SANDBOX_MODE=${SENT_SANDBOX_MODE:-true}
      # Telephony & Carriers
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - TERMII_API_KEY=${TERMII_API_KEY:-}
      - TERMII_SENDER_ID=${TERMII_SENDER_ID:-Rentmaikar}
      # Payments & Identity
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-}
      - OPAY_SECRET_KEY=${OPAY_SECRET_KEY:-}
      - PERSONA_API_KEY=${PERSONA_API_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
    networks:
      - rentmaikar-network

networks:
  rentmaikar-network:
    driver: bridge
