server {
    listen 80;
    listen 8080;
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Performance & Compression (Brotli/Gzip)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/xml
        application/json
        application/ld+json
        application/manifest+json
        image/svg+xml;

    # Security Headers (OWASP Recommended)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Probes for Kubernetes / Cloud Run / Traffic Monitors
    location /_health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location /livez {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location /readyz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # SPA Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
        # Disable caching for root index.html to ensure users always receive latest releases
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Static Assets Long-term Immutable Cache (Vite hashed bundles)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Error handling
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
