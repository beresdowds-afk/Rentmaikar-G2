# =============================================================
# RentMaikar Production Frontend Ingress & Reverse Proxy Router
# Router: Nginx 1.25 Alpine
# Platforms: Google Cloud Run (rentmaikar-g2), Cloudflare CDN, Docker
# Port Bindings: 80 (Standard), 8080 (Cloud Run Default), 3000 (Vite compatibility)
# Confirmed Backend Cloud Run: https://rentmaikar-backend-672260445879.europe-west1.run.app
# =============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen 8080 default_server;
    listen 3000 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 8.8.8.8 1.1.1.1 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Performance & Compression (Brotli/Gzip)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/xml
        application/json
        application/ld+json
        application/manifest+json
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Health Probes
    location /_health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location /livez {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location /readyz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Supabase Authoritative Edge Functions: /functions/v1/*
    location /functions/v1/ {
        set $supabase_upstream "https://jrsydiofzceoeddjogov.supabase.co";
        proxy_pass $supabase_upstream$request_uri;

        proxy_ssl_server_name on;
        proxy_ssl_name jrsydiofzceoeddjogov.supabase.co;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;

        proxy_set_header Host jrsydiofzceoeddjogov.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
        proxy_set_header x-client-info $http_x_client_info;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;

        proxy_pass_request_headers on;
        proxy_pass_request_body on;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Dedicated Rentmaikar Backend API Gateway: /api/*
    location /api/ {
        set $backend_upstream "https://rentmaikar-backend-672260445879.europe-west1.run.app";
        proxy_pass $backend_upstream$request_uri;

        proxy_ssl_server_name on;
        proxy_ssl_name rentmaikar-backend-672260445879.europe-west1.run.app;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;

        proxy_set_header Host rentmaikar-backend-672260445879.europe-west1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
        proxy_set_header x-client-info $http_x_client_info;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;

        proxy_pass_request_headers on;
        proxy_pass_request_body on;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Dedicated Backend Operations Portal: /portal
    location ^~ /portal {
        set $backend_upstream "https://rentmaikar-backend-672260445879.europe-west1.run.app";
        proxy_pass $backend_upstream$request_uri;

        proxy_ssl_server_name on;
        proxy_ssl_name rentmaikar-backend-672260445879.europe-west1.run.app;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;

        proxy_set_header Host rentmaikar-backend-672260445879.europe-west1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_pass_request_headers on;
        proxy_pass_request_body on;
    }

    # Dynamic XML Sitemap: /sitemap.xml
    location = /sitemap.xml {
        set $backend_upstream "https://rentmaikar-backend-672260445879.europe-west1.run.app";
        proxy_pass $backend_upstream/sitemap.xml;
        proxy_ssl_server_name on;
        proxy_ssl_name rentmaikar-backend-672260445879.europe-west1.run.app;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host rentmaikar-backend-672260445879.europe-west1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Static Assets Long-term Immutable Cache (Vite hashed bundles)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
