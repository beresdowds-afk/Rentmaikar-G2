name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck + unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Dependency installs are the most common transient failure (registry
      # blips). Retry them, never the deterministic checks below.
      - name: Install dependencies (retried)
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt $attempt); retrying"
            sleep $((attempt * 10))
          done
          exit 1
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Lint
        run: npm run lint
      - name: Env surface guardrail
        run: npm run check:env-surfaces
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm run test
      - name: Build
        run: npm run build

  onboarding-e2e-db:
    name: Onboarding registration DB E2E (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - name: Skip if secrets missing
        if: ${{ env.VITE_SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: echo "::warning::Skipping onboarding DB E2E — required secrets not set."
      - name: Registration + onboarding E2E
        if: ${{ env.VITE_SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          deno test -A \
            supabase/tests/registration-onboarding-e2e.test.ts \
            supabase/tests/onboarding-fanout-payload.test.ts \
            supabase/tests/onboarding-trigger-failure-recovery.test.ts

  playwright-e2e:
    name: Playwright browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_DRIVER_EMAIL: ${{ secrets.E2E_DRIVER_EMAIL }}
      E2E_DRIVER_PASSWORD: ${{ secrets.E2E_DRIVER_PASSWORD }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_AUTH_SIGNUP_ENABLED: ${{ vars.E2E_AUTH_SIGNUP_ENABLED }}
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (retried)
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt $attempt); retrying"
            sleep $((attempt * 10))
          done
          exit 1
      - name: Install Playwright browsers (retried)
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::playwright install failed (attempt $attempt); retrying"
            sleep $((attempt * 10))
          done
          exit 1
      - name: Start dev server
        run: npm run dev &
        env:
          NODE_ENV: test
      - name: Wait for dev server
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:3000 >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "dev server never became ready" >&2
          exit 1
      - name: Run Playwright
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:3000
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
