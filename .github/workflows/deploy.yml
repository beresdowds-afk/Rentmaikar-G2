name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Run Linter
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Frontend Build Test
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Backend Typecheck & Build Test
        run: |
          npm --prefix backend ci || npm --prefix backend install
          npm --prefix backend run build

  deploy-frontend:
    name: Deploy Frontend (rentmaikar-g2)
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_WIF_SERVICE_ACCOUNT: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Require GCP credentials
        run: |
          if [ -z "$GCP_SA_KEY" ] && [ -z "$GCP_WIF_PROVIDER" ]; then
            echo "::error::No GCP credentials configured (set vars GCP_WORKLOAD_IDENTITY_PROVIDER/GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT, or secret GCP_SA_KEY). Refusing to report a green deploy without deploying."
            exit 1
          fi

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: env.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        if: env.GCP_SA_KEY != '' && env.GCP_WIF_PROVIDER == ''
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker with GCP
        run: gcloud auth configure-docker --quiet

      - name: Build and Push Frontend Docker Image
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID || 'avian-computer-477009-v0' }}"
          docker build \
            --build-arg VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL || 'https://jrsydiofzceoeddjogov.supabase.co' }}" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_uE7DPlUSNxgQ1pfEA6nfQA_Z0VDAP4p' }}" \
            --build-arg VITE_API_BASE_URL=https://staging.rentmaikar.com/api \
            --build-arg VITE_STAGING_API_BASE_URL=https://staging.rentmaikar.com/api \
            -t gcr.io/${PROJECT_ID}/rentmaikar:${{ github.sha }} \
            -t gcr.io/${PROJECT_ID}/rentmaikar:latest .
          docker push gcr.io/${PROJECT_ID}/rentmaikar:${{ github.sha }}
          docker push gcr.io/${PROJECT_ID}/rentmaikar:latest

      # Deploy Frontend SPA container (Nginx on Port 80) serving rentmaikar.com
      # Proxies /api/* requests to the backend service rentmaikar-backend
      - name: Deploy Frontend to Cloud Run (rentmaikar-g2)
        run: |
          gcloud run deploy rentmaikar-g2 \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID || 'avian-computer-477009-v0' }}/rentmaikar:${{ github.sha }} \
            --region europe-west1 \
            --port 80 \
            --allow-unauthenticated \
            --update-env-vars BACKEND_URL=https://rentmaikar-backend-672260445879.europe-west1.run.app,SUPABASE_URL=https://jrsydiofzceoeddjogov.supabase.co

  deploy-backend:
    name: Deploy Backend (rentmaikar-backend)
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_WIF_SERVICE_ACCOUNT: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Require GCP credentials
        run: |
          if [ -z "$GCP_SA_KEY" ] && [ -z "$GCP_WIF_PROVIDER" ]; then
            echo "::error::No GCP credentials configured (set vars GCP_WORKLOAD_IDENTITY_PROVIDER/GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT, or secret GCP_SA_KEY). Refusing to report a green deploy without deploying."
            exit 1
          fi

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: env.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        if: env.GCP_SA_KEY != '' && env.GCP_WIF_PROVIDER == ''
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker with GCP
        run: gcloud auth configure-docker --quiet

      - name: Build and Push Backend Docker Image
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID || 'avian-computer-477009-v0' }}"
          docker build \
            -t gcr.io/${PROJECT_ID}/rentmaikar-backend:${{ github.sha }} \
            -t gcr.io/${PROJECT_ID}/rentmaikar-backend:latest ./backend
          docker push gcr.io/${PROJECT_ID}/rentmaikar-backend:${{ github.sha }}
          docker push gcr.io/${PROJECT_ID}/rentmaikar-backend:latest

      # Deploy Backend Gateway container (Express/Node.js on Port 8080) serving staging.rentmaikar.com
      # Authoritative for send-outbound-email, Resend integration, telematics, and payments
      - name: Deploy Backend to Cloud Run (rentmaikar-backend)
        run: |
          gcloud run deploy rentmaikar-backend \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID || 'avian-computer-477009-v0' }}/rentmaikar-backend:${{ github.sha }} \
            --region europe-west1 \
            --port 8080 \
            --allow-unauthenticated \
            --update-env-vars NODE_ENV=production,PUBLIC_BACKEND_URL=https://staging.rentmaikar.com,RESEND_SENDING_DOMAIN=notify.rentmaikar.com,SUPABASE_URL=https://jrsydiofzceoeddjogov.supabase.co \
            --set-secrets PORTAL_SECRET_KEY=portal-secret-key:latest,PORTAL_ADMIN_PASSWORD=portal-admin-password:latest,PORTAL_MASTER_KEY=portal-master-key:latest,SENT_WEBHOOK_SECRET=sent-webhook-secret:latest
