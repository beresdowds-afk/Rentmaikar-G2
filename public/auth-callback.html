<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authentication Complete — RentMaikar</title>
  <style>
    body {
      background: #0A1628;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: #132238;
      border: 1px solid #1E3A5F;
      border-radius: 12px;
      padding: 24px 32px;
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h3 style="margin: 0 0 8px 0; font-size: 18px;">Authentication Complete</h3>
    <p style="margin: 0; color: #94A3B8; font-size: 14px;">Closing window and returning to RentMaikar...</p>
  </div>
  <script>
    try {
      if (window.opener) {
        window.opener.postMessage({ type: 'OAUTH_AUTH_SUCCESS', provider: 'google' }, '*');
        window.opener.postMessage({ type: 'GOOGLE_OAUTH_SUCCESS', provider: 'google' }, '*');
      }
    } catch (e) {}
    setTimeout(function() {
      try {
        window.close();
      } catch (e) {}
    }, 400);
  </script>
</body>
</html>
