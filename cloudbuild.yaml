steps:
  # 1. Build the multi-stage container image using the root Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rentmaikar:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rentmaikar:latest'
      - '.'

  # 2. Push the built container image to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/rentmaikar:$COMMIT_SHA'

  # 3. Deploy the container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'rentmaikar'
      - '--image'
      - 'gcr.io/$PROJECT_ID/rentmaikar:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--port'
      - '80'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/rentmaikar:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/rentmaikar:latest'

options:
  logging: CLOUD_LOGGING_ONLY
