steps:
  # 1. Build the multi-stage container image using the root Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_SUPABASE_URL=https://jrsydiofzceoeddjogov.supabase.co'
      - '--build-arg'
      - 'VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_uE7DPlUSNxgQ1pfEA6nfQA_Z0VDAP4p'
      - '--build-arg'
      - 'VITE_SUPABASE_ANON_KEY=sb_publishable_uE7DPlUSNxgQ1pfEA6nfQA_Z0VDAP4p'
      - '--build-arg'
      - 'VITE_API_BASE_URL=https://staging.rentmaikar.com/api'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rentmaikar:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rentmaikar:latest'
      - '.'

  # 2. Push the built container image to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/rentmaikar:$COMMIT_SHA'

  # 3. Deploy the frontend container image to Google Cloud Run (rentmaikar-g2)
  # NOTE: rentmaikar-g2 is the Frontend SPA container (Nginx on Port 80) serving rentmaikar.com
  # It proxies /api/* requests to the backend service rentmaikar-backend.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'rentmaikar-g2'
      - '--image'
      - 'gcr.io/$PROJECT_ID/rentmaikar:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--port'
      - '80'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'BACKEND_URL=https://rentmaikar-backend-672260445879.europe-west1.run.app,SUPABASE_URL=https://jrsydiofzceoeddjogov.supabase.co'

  # 4. Build the self-contained backend container image using backend/Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rentmaikar-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rentmaikar-backend:latest'
      - './backend'

  # 5. Push the backend container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/rentmaikar-backend:$COMMIT_SHA'

  # 6. Deploy the backend container image to Google Cloud Run (rentmaikar-backend)
  # NOTE: rentmaikar-backend is the Authoritative Backend API Gateway & Application Email Engine (Port 8080)
  # Hostname: staging.rentmaikar.com. Dispatches transactional emails via Resend from notify.rentmaikar.com.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'rentmaikar-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/rentmaikar-backend:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--port'
      - '8080'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production,PUBLIC_BACKEND_URL=https://staging.rentmaikar.com,RESEND_SENDING_DOMAIN=notify.rentmaikar.com,SUPABASE_URL=https://jrsydiofzceoeddjogov.supabase.co'

images:
  - 'gcr.io/$PROJECT_ID/rentmaikar:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/rentmaikar:latest'
  - 'gcr.io/$PROJECT_ID/rentmaikar-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/rentmaikar-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
